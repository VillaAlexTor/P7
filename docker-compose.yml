services:
  api:
    build:
      context: ./apps/api
    environment:
      P7_API_PORT: "8080"
      P7_ALLOWED_ORIGINS: http://localhost:3000
      P7_OLLAMA_URL: http://host.docker.internal:11434
      P7_OLLAMA_MODEL: qwen3:4b-instruct
    ports:
      - "8080:8080"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

