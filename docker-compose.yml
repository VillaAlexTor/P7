name: p7

services:
  ollama:
    image: ollama/ollama:0.40.18
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama-init:
    image: ollama/ollama:0.40.18
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${P7_OLLAMA_MODEL:-qwen3:4b-instruct}"]
    depends_on:
      ollama:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      P7_API_PORT: "8080"
      P7_ALLOWED_ORIGINS: ${P7_ALLOWED_ORIGINS:-http://localhost:3000}
      P7_OLLAMA_URL: http://ollama:11434
      P7_OLLAMA_MODEL: ${P7_OLLAMA_MODEL:-qwen3:4b-instruct}
      P7_MAX_CONCURRENT_ANALYSES: ${P7_MAX_CONCURRENT_ANALYSES:-1}
      P7_ANALYSES_PER_MINUTE: ${P7_ANALYSES_PER_MINUTE:-6}
    ports:
      - "${P7_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${P7_WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

volumes:
  ollama-data:

